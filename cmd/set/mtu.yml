---
- name: Set network interface MTU
  hosts: "{{ oreol_target }}"
  become: false
  gather_facts: false

  tasks:
    - name: Validate interface and MTU parameters
      ansible.builtin.assert:
        that:
          - interface_name | default('') is match('^[a-zA-Z0-9_][a-zA-Z0-9_.:-]*$')
          - mtu_value | default('') | string is match('^[0-9]+$')
          - mtu_value | default(0) | int > 0
        fail_msg: "Provide a valid interface_name and a positive mtu_value."

    - name: Set MTU and bring the interface up
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - ifconfig
          - "{{ interface_name }}"
          - mtu
          - "{{ mtu_value | string }}"
          - up
