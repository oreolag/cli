# SYNTHETIC EXAMPLE: server-01. Do not install unchanged as live inventory.
# All addresses, IDs, serials and PCI topology are illustrative; replace them.
# CPU example: two sockets, 16 cores each, SMT disabled, one NUMA node/socket.
# count is logical CPUs; NUMA memory/storage are disjoint allocations of totals.
# NUMA device lists reference category IDs. BMC is outside host NUMA topology.
# speed is configured per-port link rate; ports is physical port count.
# peer.port matches the remote interface name in switches.yml exactly.
# Locally administered MACs and private IPs are synthetic. Data links use
# separate subnets; switching/VLAN/routing configuration is outside this CMDB.
# eno2 is an unused management port. BMC name is an inventory label.
# FPGA interface names assume a suitable network design/driver; they are not
# supplied by every FPGA image. Their bdf is null: no separate PCI function
# is assumed for a fabric Ethernet port. platform and LinkCtl must be discovered
# for the actual deployment (LinkCtl is a register offset, not a link speed).
# Hardware references: https://docs.amd.com/r/en-US/ug1469-alveo-u55c/Card-Features
# https://www.intel.com/content/www/us/en/products/sku/52968/intel-ethernet-controller-i350am2/specifications.html
# https://www.nvidia.com/en-us/data-center/a100/

