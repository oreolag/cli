# Commands in comments are manual discovery hints; replace example interface names.
# Storage helper commands report live available space, not the example capacity.
# SYNTHETIC EXAMPLE: server-01. Do not install unchanged as live inventory.
# All addresses, IDs, serials and PCI topology are illustrative; replace them.
# CPU example: two sockets, 16 cores each, SMT disabled, one NUMA node/socket.
# count is logical CPUs; NUMA memory/storage are disjoint allocations of totals.
# NUMA device lists reference category IDs. BMC is outside host NUMA topology.
# speed is configured per-port link rate; ports is physical port count.
# peer.port matches the remote interface name in switches.yml exactly.
# Locally administered MACs and private IPs are synthetic. Address plan:
# OOB: 10.0.1.0/24; management: 10.0.2.0/24; high-speed: 10.0.4.0/24.
# NIC ports use 10.0.4.10-11; FPGA ports use 10.0.4.20-23.
# All high-speed ports share a Layer-2 network/VLAN across the leaf/spine fabric.
# Switch configuration and host routing/ARP policy are outside this CMDB.
# eno2 is an unused management port. BMC name is an inventory label.
# FPGA interface names assume a suitable network design/driver; they are not
# supplied by every FPGA image. Their bdf is null: no separate PCI function
# is assumed for a fabric Ethernet port. platform and LinkCtl must be discovered
# for the actual deployment (LinkCtl is a register offset, not a link speed).
# Hardware references: https://docs.amd.com/r/en-US/ug1469-alveo-u55c/Card-Features
# https://www.intel.com/content/www/us/en/products/sku/52968/intel-ethernet-controller-i350am2/specifications.html
# https://www.nvidia.com/en-us/data-center/a100/

devices:
  accel:
    - id: 0
      vendor: "Xilinx"
      model: "u55c"
      bdf: "0000:41:00.0"
      upstream_port: "41:00.0"
      root_port: "40:01.1"
      LinkCtl: null
      type: "fpga"
      name: "xcu55c_0"
      serial: "EXAMPLE-FPGA-001"
      platform: null
      part: "xcu55c-fsvh2892-2L-e"
      speed: "100Gbps"
      ports: 2
      uplinks:
        - id: 0
          name: "enaccel0f0np0"
          bdf: null
          mac: "02:00:00:04:00:00" # cat /sys/class/net/enaccel0f0np0/address
          ip_address: "10.0.4.20" # ip -4 -o addr show dev enaccel0f0np0 | awk '{split($4, a, "/"); print a[1]}'
          ip_mask: 24 # ip -4 -o addr show dev enaccel0f0np0 | awk '{split($4, a, "/"); print a[2]}'
          peer:
            device: "leaf-01"
            port: "Ethernet2"
        - id: 1
          name: "enaccel0f1np1"
          bdf: null
          mac: "02:00:00:04:00:01" # cat /sys/class/net/enaccel0f1np1/address
          ip_address: "10.0.4.21" # ip -4 -o addr show dev enaccel0f1np1 | awk '{split($4, a, "/"); print a[1]}'
          ip_mask: 24 # ip -4 -o addr show dev enaccel0f1np1 | awk '{split($4, a, "/"); print a[2]}'
          peer:
            device: "leaf-02"
            port: "Ethernet2"
    - id: 1
      vendor: "Xilinx"
      model: "u55c"
      bdf: "0000:c1:00.0"
      upstream_port: "c1:00.0"
      root_port: "c0:01.1"
      LinkCtl: null
      type: "fpga"
      name: "xcu55c_1"
      serial: "EXAMPLE-FPGA-002"
      platform: null
      part: "xcu55c-fsvh2892-2L-e"
      speed: "100Gbps"
      ports: 2
      uplinks:
        - id: 0
          name: "enaccel1f0np0"
          bdf: null
          mac: "02:00:00:04:01:00" # cat /sys/class/net/enaccel1f0np0/address
          ip_address: "10.0.4.22" # ip -4 -o addr show dev enaccel1f0np0 | awk '{split($4, a, "/"); print a[1]}'
          ip_mask: 24 # ip -4 -o addr show dev enaccel1f0np0 | awk '{split($4, a, "/"); print a[2]}'
          peer:
            device: "leaf-01"
            port: "Ethernet3"
        - id: 1
          name: "enaccel1f1np1"
          bdf: null
          mac: "02:00:00:04:01:01" # cat /sys/class/net/enaccel1f1np1/address
          ip_address: "10.0.4.23" # ip -4 -o addr show dev enaccel1f1np1 | awk '{split($4, a, "/"); print a[1]}'
          ip_mask: 24 # ip -4 -o addr show dev enaccel1f1np1 | awk '{split($4, a, "/"); print a[2]}'
          peer:
            device: "leaf-02"
            port: "Ethernet3"
  cpu:
    model: "Example dual-socket x86_64 server" # "$ODEV_PATH/src/cmdb_get_model.sh"
    count: 32 # "$ODEV_PATH/src/cmdb_get_cpu.sh"
    list: "0-31" # cat /sys/devices/system/cpu/online
    memory: "256GB" # "$ODEV_PATH/src/cmdb_get_memory.sh"
    storage: "3.8TB" # Available: "$ODEV_PATH/src/cmdb_get_storage.sh" TB
    numa:
      - id: 0
        list: "0-15" # "$ODEV_PATH/src/cmdb_get_cpu.sh" 0
        memory: "128GB" # "$ODEV_PATH/src/cmdb_get_memory.sh" 0
        storage: "1.9TB" # Available: "$ODEV_PATH/src/cmdb_get_storage.sh" TB 0
        enoob: null
        enmgmt: [0]
        endata: [0]
        gpu: [0]
        accel: [0]
      - id: 1
        list: "16-31" # "$ODEV_PATH/src/cmdb_get_cpu.sh" 1
        memory: "128GB" # "$ODEV_PATH/src/cmdb_get_memory.sh" 1
        storage: "1.9TB" # Available: "$ODEV_PATH/src/cmdb_get_storage.sh" TB 1
        enoob: null
        enmgmt: null
        endata: null
        gpu: [1]
        accel: [1]
  enoob:
    - id: 0
      vendor: "ASPEED"
      model: "AST2600 BMC"
      speed: "1Gbps"
      ports: 1
      access:
        - id: 0
          name: "bmc1"
          mac: "02:00:00:01:00:10"
          ip_address: "10.0.1.10"
          ip_mask: 24
          peer:
            device: "oob-01"
            port: "Ethernet2"
  enmgmt:
    - id: 0
      vendor: "Intel"
      model: "I350-AM2"
      speed: "1Gbps"
      ports: 2
      access:
        - id: 0
          name: "eno1"
          bdf: "0000:02:00.0" # ethtool -i eno1 | awk '/bus-info:/ {print $2}'
          mac: "02:00:00:02:00:10" # cat /sys/class/net/eno1/address
          ip_address: "10.0.2.10" # ip -4 -o addr show dev eno1 | awk '{split($4, a, "/"); print a[1]}'
          ip_mask: 24 # ip -4 -o addr show dev eno1 | awk '{split($4, a, "/"); print a[2]}'
          peer:
            device: "mgmt-01"
            port: "Ethernet4"
        - id: 1
          name: "eno2"
          bdf: "0000:02:00.1" # ethtool -i eno2 | awk '/bus-info:/ {print $2}'
          mac: "02:00:00:02:00:11" # cat /sys/class/net/eno2/address
          ip_address: null # ip -4 -o addr show dev eno2 | awk '{split($4, a, "/"); print a[1]}'
          ip_mask: null # ip -4 -o addr show dev eno2 | awk '{split($4, a, "/"); print a[2]}'
  endata:
    - id: 0
      vendor: "Mellanox"
      model: "ConnectX-7"
      speed: "200Gbps"
      ports: 2
      uplinks:
        - id: 0
          name: "enp1s0f0np0"
          bdf: "0000:01:00.0" # ethtool -i enp1s0f0np0 | awk '/bus-info:/ {print $2}'
          mac: "02:00:00:03:00:0a" # cat /sys/class/net/enp1s0f0np0/address
          ip_address: "10.0.4.10" # ip -4 -o addr show dev enp1s0f0np0 | awk '{split($4, a, "/"); print a[1]}'
          ip_mask: 24 # ip -4 -o addr show dev enp1s0f0np0 | awk '{split($4, a, "/"); print a[2]}'
          peer:
            device: "leaf-01"
            port: "Ethernet1"
        - id: 1
          name: "enp1s0f1np1"
          bdf: "0000:01:00.1" # ethtool -i enp1s0f1np1 | awk '/bus-info:/ {print $2}'
          mac: "02:00:00:03:00:0b" # cat /sys/class/net/enp1s0f1np1/address
          ip_address: "10.0.4.11" # ip -4 -o addr show dev enp1s0f1np1 | awk '{split($4, a, "/"); print a[1]}'
          ip_mask: 24 # ip -4 -o addr show dev enp1s0f1np1 | awk '{split($4, a, "/"); print a[2]}'
          peer:
            device: "leaf-02"
            port: "Ethernet1"
  gpu:
    - id: 0
      name: "NVIDIA A100 80GB PCIe"
      uuid: "GPU-00000000-0000-4000-8000-000000000001"
      pci_bus_id: "00000000:21:00.0"
      vendor: "NVIDIA"
      model: "A100 80GB PCIe"
      bdf: "0000:21:00.0"
    - id: 1
      name: "NVIDIA A100 80GB PCIe"
      uuid: "GPU-00000000-0000-4000-8000-000000000002"
      pci_bus_id: "00000000:a1:00.0"
      vendor: "NVIDIA"
      model: "A100 80GB PCIe"
      bdf: "0000:a1:00.0"
