# Booking servers and the machines they manage.
# An empty list means no machines require bookings.
# Use short hostnames, and assign each managed machine to only one server.
# Example entry:
# servers:
#   - name: odev-booking-01
#     id: "01" # Permanent; never reuse for another booking database.
#     timezone: Europe/Madrid # Booking input and display; storage uses UTC.
#     access:
#       host: booking-01.internal.example.com # IP, DNS or tailnet address serving OpenSSH.
#       port: 22 # Optional, defaults to 22.
#     managed_servers:
#       - incus-01
#       - incus-02
#     maximum_duration_hours: 5
#     terminate_jobs: true
servers: []
