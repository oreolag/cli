# Storage servers and the shares they provide.
# An empty list means no shared storage is configured.
# Use short hostnames and reachable storage service IPs.
# Client mounts reference the server and share in each machine's storage.mounts.
# Example entries:
# servers:
#   - name: odev-storage-01
#     ip: 10.42.30.100
#     shares:
#       scratch:
#         type: nfs
#         export: /exports/scratch
#   - name: odev-storage-02
#     ip: 10.42.30.101
#     shares:
#       scratch:
#         type: nfs
#         export: /exports/scratch
servers: []
