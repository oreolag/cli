# Storage servers and the named shares they provide.
# An empty list means no shared storage is configured.
# Server path + share name determines the export: /exports/scratch.
# Clients mount each share at /<share name>, for example /scratch.
# Present shares get private 0700 directories for present users in users.login.
# Accounts must exist with matching numeric UID/GID on server and clients.
# State absent withdraws the export without deleting directories or data.
# Example entries:
# servers:
#   - name: odev-storage-01
#     ip: 10.42.30.100
#     path: /exports
#     shares:
#       - name: scratch
#         type: nfs
#         state: present
#       - name: scratch_2
#         type: nfs
#         state: present
#   - name: odev-storage-02
#     ip: 10.42.30.101
#     path: /exports
#     shares:
#       - name: scratch
#         type: nfs
#         state: present
servers: []
